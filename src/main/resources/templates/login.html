<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>登录</title>
    <!-- jquery -->
    <script type="text/javascript" th:src="@{/js/jquery.min.js}"></script>
    <!-- bootstrap -->
    <link rel="stylesheet" type="text/css" th:href="@{/bootstrap/css/bootstrap.min.css}"/>
    <script type="text/javascript" th:src="@{/bootstrap/js/bootstrap.min.js}"></script>
    <!-- jquery-validator -->
    <script type="text/javascript" th:src="@{/jquery-validation/jquery.validate.min.js}"></script>
    <script type="text/javascript" th:src="@{/jquery-validation/localization/messages_zh.min.js}"></script>
    <!-- layer -->
    <script type="text/javascript" th:src="@{/layer/layer.js}"></script>
    <!-- md5.js -->
    <script type="text/javascript" th:src="@{/js/md5.min.js}"></script>
    <!-- common.js -->
    <script type="text/javascript" th:src="@{/js/common.js}"></script>

    <style>
        .form-group {
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
<form name="loginForm" id="loginForm" method="post" style="width:50%; margin:0 auto; margin-top: 50px;">
    <h2 style="text-align:center; margin-bottom: 20px">用户登录</h2>

    <div class="form-group">
        <label for="mobile" class="form-label">手机号</label>
        <input type="text" class="form-control" id="mobile" name="mobile" placeholder="请输入手机号">
    </div>

    <div class="form-group">
        <label for="password" class="form-label">密码</label>
        <input type="password" class="form-control" id="password" name="password" placeholder="请输入密码">
    </div>

    <div class="form-group form-check">
        <input type="checkbox" class="form-check-input" id="rememberMe" name="rememberMe">
        <label class="form-check-label" for="rememberMe">记住我</label>
    </div>

    <button type="button" class="btn btn-primary w-100" onclick="doLogin()">登录</button>
</form>

<script>
    function doLogin() {
        g_showLoading();

        var inputPass = $("#password").val();
        // 固定盐值为 1a2b3c4d
        var salt = "1a2b3c4d";
        var str = "" + salt.charAt(0) + salt.charAt(2) + inputPass + salt.charAt(5) + salt.charAt(4);
        var password = md5(str);

        $.ajax({
            url: "/login/doLogin",
            type: "POST",
            data: {
                mobile: $("#mobile").val(),
                password: password
            },
            success: function (data) {
                layer.closeAll();
                if (data.code == 200) {
                    layer.msg("登录成功！");
                    // 登录成功后跳转到商品列表页
                    window.location.href = "/goods/toList";
                } else {
                    layer.msg(data.message);
                }
            },
            error: function () {
                layer.closeAll();
                layer.msg("网络异常，请稍后重试");
            }
        });
    }

    // 表单验证
    $(function() {
        $("#loginForm").validate({
            rules: {
                mobile: {
                    required: true,
                    minlength: 11,
                    maxlength: 11
                },
                password: {
                    required: true,
                    minlength: 6
                }
            },
            messages: {
                mobile: {
                    required: "请输入手机号",
                    minlength: "手机号必须是11位",
                    maxlength: "手机号必须是11位"
                },
                password: {
                    required: "请输入密码",
                    minlength: "密码长度不能少于6个字符"
                }
            },
            errorElement: "div",
            errorPlacement: function(error, element) {
                error.addClass("invalid-feedback");
                element.closest(".form-group").append(error);
            },
            highlight: function(element) {
                $(element).addClass("is-invalid");
            },
            unhighlight: function(element) {
                $(element).removeClass("is-invalid");
            }
        });
    });
</script>
</body>
</html>
